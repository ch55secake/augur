feat:
  - changed-files:
      - any-glob-to-any-file:
          - cmd/**
          - internal/**

chore:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - config/**
          - Makefile
          - flake.lock
          - flake.nix
          - go.mod
          - go.sum
          - packaging/**

test:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*_test.go"
          - tests/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - AGENTS.md
          - README.md
