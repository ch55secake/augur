name: Pull Request Labeler

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: ch55secake/cheesecake-factory/.github/workflows/labeler.yml@main
    with:
      configuration-path: .github/labeler.yml
